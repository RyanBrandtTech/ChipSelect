schema_version: 1
part_number: nRF52840-QIAA
manufacturer: Nordic Semiconductor
description: Arm Cortex-M4F Bluetooth LE/802.15.4 SoC, 64 MHz, 1 MB flash, 256 KB RAM, USB, aQFN-73 7x7
datasheet: https://docs.nordicsemi.com/bundle/ps_nrf52840/page/keyfeatures_html5.html

# Placeholder price and stock, not live distributor data.
unit_cost_usd: 5.48
quantity_available: 46400

core: Cortex-M4F
max_clock_mhz: 64
flash_kb: 1024
ram_kb: 256
temperature: {min_c: -40, max_c: 85}

package:
  name: aQFN-73
  pin_count: 73
  length_mm: 7.0
  width_mm: 7.0
  height_mm: 0.85

power:
  supplies:
    - {name: VDD, min_v: 1.7, max_v: 3.6, required: true, description: Main and GPIO supply; an output (1.8-3.3 V) in high voltage mode}
    - {name: VDDH, min_v: 2.5, max_v: 5.5, required: false, description: High voltage mode input; tie to VDD in normal voltage mode}
    - {name: VBUS, min_v: 4.35, max_v: 5.5, required: false, description: USB supply; only needed when USB is used}
  io_voltages: [1.8, 2.5, 3.3]

counts:
  analog_inputs: 8
  analog_outputs: 0
  gpio: 48
  spi: 4
  i2c: 2
  pwm_pins: 48
  uart: 2
  can: 0
  usb: 1
  ethernet: 0
  ext_flash: 1

# Pin names are the datasheet's P0.xx / P1.xx written with "_" (P0.02 -> P0_02).
pins:
  gpio:
    [P0_00, P0_01, P0_02, P0_03, P0_04, P0_05, P0_06, P0_07,
     P0_08, P0_09, P0_10, P0_11, P0_12, P0_13, P0_14, P0_15,
     P0_16, P0_17, P0_18, P0_19, P0_20, P0_21, P0_22, P0_23,
     P0_24, P0_25, P0_26, P0_27, P0_28, P0_29, P0_30, P0_31,
     P1_00, P1_01, P1_02, P1_03, P1_04, P1_05, P1_06, P1_07,
     P1_08, P1_09, P1_10, P1_11, P1_12, P1_13, P1_14, P1_15]
  dedicated: [D-, D+]
  special:
    P0_00: 32.768 kHz crystal (XL1)
    P0_01: 32.768 kHz crystal (XL2)
    P0_09: NFC antenna (NFC1); low frequency I/O only
    P0_10: NFC antenna (NFC2); low frequency I/O only
    P0_18: nRESET pin reset

# Digital peripherals are routed to any GPIO with PSEL registers. Analog inputs
# and USB are fixed. The datasheet recommends "standard drive, low frequency I/O
# only" (up to 10 kHz) for these pins, which is NOT enforced below except for QSPI:
# P0_02 P0_03 P0_09 P0_10 P0_28 P0_29 P0_30 P0_31 P1_01-P1_07 P1_10-P1_15.
peripherals:
  SAADC:
    type: adc
    signals:
      AIN0: [P0_02]
      AIN1: [P0_03]
      AIN2: [P0_04]
      AIN3: [P0_05]
      AIN4: [P0_28]
      AIN5: [P0_29]
      AIN6: [P0_30]
      AIN7: [P0_31]

  SPIM0:
    type: spi
    shares: SERIAL0
    signals:
      SCK: &any
        [P0_00, P0_01, P0_02, P0_03, P0_04, P0_05, P0_06, P0_07,
         P0_08, P0_09, P0_10, P0_11, P0_12, P0_13, P0_14, P0_15,
         P0_16, P0_17, P0_18, P0_19, P0_20, P0_21, P0_22, P0_23,
         P0_24, P0_25, P0_26, P0_27, P0_28, P0_29, P0_30, P0_31,
         P1_00, P1_01, P1_02, P1_03, P1_04, P1_05, P1_06, P1_07,
         P1_08, P1_09, P1_10, P1_11, P1_12, P1_13, P1_14, P1_15]
      MISO: *any
      MOSI: *any
      NSS: *any
  TWIM0:
    type: i2c
    shares: SERIAL0
    signals: {SCL: *any, SDA: *any}
  SPIM1:
    type: spi
    shares: SERIAL1
    signals: {SCK: *any, MISO: *any, MOSI: *any, NSS: *any}
  TWIM1:
    type: i2c
    shares: SERIAL1
    signals: {SCL: *any, SDA: *any}
  SPIM2:
    type: spi
    signals: {SCK: *any, MISO: *any, MOSI: *any, NSS: *any}
  SPIM3:
    type: spi
    signals: {SCK: *any, MISO: *any, MOSI: *any, NSS: *any}

  UARTE0:
    type: uart
    signals: {TX: *any, RX: *any, RTS: *any, CTS: *any}
  UARTE1:
    type: uart
    signals: {TX: *any, RX: *any, RTS: *any, CTS: *any}

  PWM0:
    type: pwm
    signals: {OUT0: *any, OUT1: *any, OUT2: *any, OUT3: *any}
  PWM1:
    type: pwm
    signals: {OUT0: *any, OUT1: *any, OUT2: *any, OUT3: *any}
  PWM2:
    type: pwm
    signals: {OUT0: *any, OUT1: *any, OUT2: *any, OUT3: *any}
  PWM3:
    type: pwm
    signals: {OUT0: *any, OUT1: *any, OUT2: *any, OUT3: *any}

  USBD:
    type: usb
    signals:
      DM: [D-]
      DP: [D+]

  # QSPI is PSEL-routed too; limited here to pins not marked low frequency only.
  QSPI:
    type: ext_flash
    signals:
      CLK: &fast
        [P0_00, P0_01, P0_04, P0_05, P0_06, P0_07, P0_08, P0_11,
         P0_12, P0_13, P0_14, P0_15, P0_16, P0_17, P0_18, P0_19,
         P0_20, P0_21, P0_22, P0_23, P0_24, P0_25, P0_26, P0_27,
         P1_00, P1_08, P1_09]
      NCS: *fast
      IO0: *fast
      IO1: *fast
      IO2: *fast
      IO3: *fast
