    signals:
      TX: [PA12, PD1, PB9]
      RX: [PA11, PD0, PB8]
  FDCAN2:
    type: can
    signals:
      TX: [PB13, PB6]
      RX: [PB12, PB5]

  TIM1:
    type: pwm
    signals:
      CH1: [PE9, PA8]
      CH2: [PE11, PA9]
      CH3: [PE13, PA10]
      CH4: [PE14, PA11]
  TIM2:
    type: pwm
    signals:
      CH1: [PA0, PA5, PA15]
      CH2: [PA1, PB3]
      CH3: [PA2, PB10]
      CH4: [PA3, PB11]
  TIM3:
    type: pwm
    signals:
      CH1: [PA6, PC6, PB4]
      CH2: [PA7, PC7, PB5]
      CH3: [PB0, PC8]
      CH4: [PB1, PC9]
  TIM4:
    type: pwm
    signals:
      CH1: [PD12, PB6]
      CH2: [PD13, PB7]
      CH3: [PD14, PB8]
      CH4: [PD15, PB9]
  TIM5:
    type: pwm
    signals:
      CH1: [PA0]
      CH2: [PA1]
      CH3: [PA2]
      CH4: [PA3]
  TIM8:
    type: pwm
    signals:
      CH1: [PC6]
      CH2: [PC7]
      CH3: [PC8]
      CH4: [PC9]
  TIM12:
    type: pwm
    signals:
      CH1: [PB14]
      CH2: [PB15]
  TIM13:
    type: pwm
    signals:
      CH1: [PA6]
  TIM14:
    type: pwm
    signals:
      CH1: [PA7]
  TIM15:
    type: pwm
    signals:
      CH1: [PE5, PA2]
      CH2: [PE6, PA3]
  TIM16:
    type: pwm
    signals:
      CH1: [PB8]
  TIM17:
    type: pwm
    signals:
      CH1: [PB9]

  USB_OTG_FS:
    type: usb
    signals:
      DM: [PA11]
      DP: [PA12]
      ID: [PA10]
      VBUS: [PA9]
  USB_OTG_HS:
    type: usb
    signals:
      DM: [PB14]
      DP: [PB15]
