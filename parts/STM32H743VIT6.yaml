schema_version: 1
part_number: STM32H743VIT6
manufacturer: STMicroelectronics
description: Arm Cortex-M7 MCU, 480 MHz, 2048 KB flash, 1056 KB RAM, Ethernet, USB OTG FS/HS, 2x FDCAN, QUADSPI, LQFP-100
datasheet: https://www.st.com/resource/en/datasheet/stm32h743vi.pdf

# Price and stock as of 2026-10-11; not live data.
unit_cost_usd: 11.38
quantity_available: 112

core: Cortex-M7
max_clock_mhz: 480
flash_kb: 2048
ram_kb: 1056
temperature: {min_c: -40, max_c: 85}

package:
  name: LQFP-100
  pin_count: 100
  length_mm: 16.0
  width_mm: 16.0
  height_mm: 1.6

power:
  supplies:
    - {name: VDD, min_v: 1.62, max_v: 3.6, required: true, description: 3.0 V minimum when USB is used}
    - {name: VDDA, min_v: 1.62, max_v: 3.6, required: true, description: Analog supply; 1.8 V minimum for DAC/VREFBUF and 2.0 V for OPAMP}
    - {name: VREF+, min_v: 1.62, max_v: 3.6, required: false, description: ADC/DAC reference; tie to VDDA or drive from the internal VREFBUF}
    - {name: VBAT, min_v: 1.2, max_v: 3.6, required: false, description: RTC and backup domain; tie to VDD if unused}
  io_voltages: [1.8, 2.5, 3.3]

counts:
  analog_inputs: 16
  analog_outputs: 2
  gpio: 82
  spi: 5
  i2c: 4
  pwm_pins: 39
  uart: 9
  can: 2
  usb: 2
  ethernet: 1
  ext_flash: 1

pins:
  gpio:
    [PE2, PE3, PE4, PE5, PE6, PC13, PC14, PC15, PH0, PH1, PC0, PC1,
     PC2_C, PC3_C, PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7, PC4, PC5,
     PB0, PB1, PB2, PE7, PE8, PE9, PE10, PE11, PE12, PE13, PE14, PE15,
     PB10, PB11, PB12, PB13, PB14, PB15, PD8, PD9, PD10, PD11, PD12, PD13,
     PD14, PD15, PC6, PC7, PC8, PC9, PA8, PA9, PA10, PA11, PA12, PA13,
     PA14, PA15, PC10, PC11, PC12, PD0, PD1, PD2, PD3, PD4, PD5, PD6,
     PD7, PB3, PB4, PB5, PB6, PB7, PB8, PB9, PE0, PE1]
  special:
    PA13: SWDIO debug
    PA14: SWCLK debug
    PC14: 32.768 kHz crystal (OSC32_IN)
    PC15: 32.768 kHz crystal (OSC32_OUT)
    PH0: main crystal (OSC_IN)
    PH1: main crystal (OSC_OUT)

# STM32H7 pins select alternate functions independently, so signals are listed per pin.
# USB_OTG_HS is modelled with its on-chip full-speed PHY pins only (no ULPI).
# PC2_C and PC3_C are the datasheet names of pins 17 and 18.
peripherals:
  ADC:
    type: adc
    signals:
      ADC1_INP16: [PA0]
      ADC1_INP17: [PA1]
      ADC3_INP0: [PC2_C]
      ADC3_INP1: [PC3_C]
      ADC12_INP3: [PA6]
      ADC12_INP4: [PC4]
      ADC12_INP5: [PB1]
      ADC12_INP7: [PA7]
      ADC12_INP8: [PC5]
      ADC12_INP9: [PB0]
      ADC12_INP14: [PA2]
      ADC12_INP15: [PA3]
      ADC12_INP18: [PA4]
      ADC12_INP19: [PA5]
      ADC123_INP10: [PC0]
      ADC123_INP11: [PC1]

  DAC1:
    type: dac
    signals:
      OUT1: [PA4]
      OUT2: [PA5]

  SPI1:
    type: spi
    signals:
      SCK: [PA5, PB3]
      MISO: [PA6, PB4]
      MOSI: [PA7, PD7, PB5]
      NSS: [PA4, PA15]
  SPI2:
    type: spi
    signals:
      SCK: [PB10, PB13, PA9, PA12, PD3]
      MISO: [PC2_C, PB14]
      MOSI: [PC1, PC3_C, PB15]
      NSS: [PB12, PA11, PB4, PB9]
  SPI3:
    type: spi
    signals:
      SCK: [PC10, PB3]
      MISO: [PC11, PB4]
      MOSI: [PB2, PC12, PD6, PB5]
      NSS: [PA4, PA15]
  SPI4:
    type: spi
    signals:
      SCK: [PE2, PE12]
      MISO: [PE5, PE13]
      MOSI: [PE6, PE14]
      NSS: [PE4, PE11]
  SPI6:
    type: spi
    signals:
      SCK: [PA5, PB3]
      MISO: [PA6, PB4]
      MOSI: [PA7, PB5]
      NSS: [PA4, PA15]

  I2C1:
    type: i2c
    signals:
      SCL: [PB6, PB8]
      SDA: [PB7, PB9]
  I2C2:
    type: i2c
    signals:
      SCL: [PB10]
      SDA: [PB11]
  I2C3:
    type: i2c
    signals:
      SCL: [PA8]
      SDA: [PC9]
  I2C4:
    type: i2c
    signals:
      SCL: [PD12, PB6, PB8]
      SDA: [PD13, PB7, PB9]

  LPUART1:
    type: uart
    signals:
      TX: [PA9, PB6]
      RX: [PA10, PB7]
      RTS: [PA12]
      CTS: [PA11]
  UART4:
    type: uart
    signals:
      TX: [PA0, PA12, PC10, PD1, PB9]
      RX: [PA1, PA11, PC11, PD0, PB8]
      RTS: [PB14, PA15]
      CTS: [PB0, PB15]
  UART5:
    type: uart
    signals:
      TX: [PB13, PC12, PB6]
      RX: [PB12, PD2, PB5]
      RTS: [PC8]
      CTS: [PC9]
  UART7:
    type: uart
    signals:
      TX: [PE8, PA15, PB4]
      RX: [PE7, PA8, PB3]
      RTS: [PE9]
      CTS: [PE10]
  UART8:
    type: uart
    signals:
      TX: [PE1]
      RX: [PE0]
      RTS: [PD15]
      CTS: [PD14]
  USART1:
    type: uart
    signals:
      TX: [PB14, PA9, PB6]
      RX: [PB15, PA10, PB7]
      RTS: [PA12]
      CTS: [PA11]
      CK: [PA8]
  USART2:
    type: uart
    signals:
      TX: [PA2, PD5]
      RX: [PA3, PD6]
      RTS: [PA1, PD4]
      CTS: [PA0, PD3]
      CK: [PA4, PD7]
  USART3:
    type: uart
    signals:
      TX: [PB10, PD8, PC10]
      RX: [PB11, PD9, PC11]
      RTS: [PB14, PD12]
      CTS: [PB13, PD11]
      CK: [PB12, PD10, PC12]
  USART6:
    type: uart
    signals:
      TX: [PC6]
      RX: [PC7]
      CK: [PC8]

  FDCAN1:
