schema_version: 1
part_number: STM32F407VGT6
manufacturer: STMicroelectronics
description: Arm Cortex-M4F MCU, 168 MHz, 1024 KB flash, 192 KB RAM, Ethernet, USB OTG FS/HS, 2x CAN, LQFP-100
datasheet: https://www.st.com/resource/en/datasheet/stm32f407vg.pdf

# Price and stock as of 2026-10-11; not live data.
unit_cost_usd: 6.14
quantity_available: 1947

core: Cortex-M4
max_clock_mhz: 168
flash_kb: 1024
ram_kb: 192
temperature: {min_c: -40, max_c: 85}

package:
  name: LQFP-100
  pin_count: 100
  length_mm: 16.0
  width_mm: 16.0
  height_mm: 1.6

power:
  supplies:
    - {name: VDD, min_v: 1.8, max_v: 3.6, required: true}
    - {name: VDDA, min_v: 1.8, max_v: 3.6, required: true, description: Analog supply; same potential as VDD}
    - {name: VREF+, min_v: 1.8, max_v: 3.6, required: true, description: ADC/DAC reference; normally tied to VDDA}
    - {name: VBAT, min_v: 1.65, max_v: 3.6, required: false, description: RTC and backup domain; tie to VDD if unused}
  io_voltages: [1.8, 2.5, 3.3]

counts:
  analog_inputs: 16
  analog_outputs: 2
  gpio: 82
  spi: 3
  i2c: 3
  pwm_pins: 39
  uart: 6
  can: 2
  usb: 2
  ethernet: 1
  ext_flash: 0

pins:
  gpio:
    [PE2, PE3, PE4, PE5, PE6, PC13, PC14, PC15, PH0, PH1, PC0, PC1,
     PC2, PC3, PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7, PC4, PC5,
     PB0, PB1, PB2, PE7, PE8, PE9, PE10, PE11, PE12, PE13, PE14, PE15,
     PB10, PB11, PB12, PB13, PB14, PB15, PD8, PD9, PD10, PD11, PD12, PD13,
     PD14, PD15, PC6, PC7, PC8, PC9, PA8, PA9, PA10, PA11, PA12, PA13,
     PA14, PA15, PC10, PC11, PC12, PD0, PD1, PD2, PD3, PD4, PD5, PD6,
     PD7, PB3, PB4, PB5, PB6, PB7, PB8, PB9, PE0, PE1]
  special:
    PA13: SWDIO debug
    PA14: SWCLK debug
    PB2: BOOT1 strap
    PC14: 32.768 kHz crystal (OSC32_IN)
    PC15: 32.768 kHz crystal (OSC32_OUT)
    PH0: main crystal (OSC_IN)
    PH1: main crystal (OSC_OUT)

# STM32F4 pins select alternate functions independently, so signals are listed per pin.
# USB_OTG_HS is modelled with its on-chip full-speed PHY pins only (no ULPI).
peripherals:
  ADC:
    type: adc
    signals:
      ADC12_IN4: [PA4]
      ADC12_IN5: [PA5]
      ADC12_IN6: [PA6]
      ADC12_IN7: [PA7]
      ADC12_IN8: [PB0]
      ADC12_IN9: [PB1]
      ADC12_IN14: [PC4]
      ADC12_IN15: [PC5]
      ADC123_IN0: [PA0]
      ADC123_IN1: [PA1]
      ADC123_IN2: [PA2]
      ADC123_IN3: [PA3]
      ADC123_IN10: [PC0]
      ADC123_IN11: [PC1]
      ADC123_IN12: [PC2]
      ADC123_IN13: [PC3]

  DAC:
    type: dac
    signals:
      OUT1: [PA4]
      OUT2: [PA5]

  SPI1:
    type: spi
    signals:
      SCK: [PA5, PB3]
      MISO: [PA6, PB4]
      MOSI: [PA7, PB5]
      NSS: [PA4, PA15]
  SPI2:
    type: spi
    signals:
      SCK: [PB10, PB13]
      MISO: [PC2, PB14]
      MOSI: [PC3, PB15]
      NSS: [PB12, PB9]
  SPI3:
    type: spi
    signals:
      SCK: [PC10, PB3]
      MISO: [PC11, PB4]
      MOSI: [PC12, PB5]
      NSS: [PA4, PA15]

  I2C1:
    type: i2c
    signals:
      SCL: [PB6, PB8]
      SDA: [PB7, PB9]
  I2C2:
    type: i2c
    signals:
      SCL: [PB10]
      SDA: [PB11]
  I2C3:
    type: i2c
    signals:
      SCL: [PA8]
      SDA: [PC9]

  UART4:
    type: uart
    signals:
      TX: [PA0, PC10]
      RX: [PA1, PC11]
  UART5:
    type: uart
    signals:
      TX: [PC12]
      RX: [PD2]
  USART1:
    type: uart
    signals:
      TX: [PA9, PB6]
      RX: [PA10, PB7]
      RTS: [PA12]
      CTS: [PA11]
      CK: [PA8]
  USART2:
    type: uart
    signals:
      TX: [PA2, PD5]
      RX: [PA3, PD6]
      RTS: [PA1, PD4]
      CTS: [PA0, PD3]
      CK: [PA4, PD7]
  USART3:
    type: uart
    signals:
      TX: [PB10, PD8, PC10]
      RX: [PB11, PD9, PC11]
      RTS: [PB14, PD12]
      CTS: [PB13, PD11]
      CK: [PB12, PD10, PC12]
  USART6:
    type: uart
    signals:
      TX: [PC6]
      RX: [PC7]
      CK: [PC8]

  CAN1:
    type: can
    signals:
      TX: [PA12, PD1, PB9]
      RX: [PA11, PD0, PB8]
  CAN2:
    type: can
    signals:
      TX: [PB13, PB6]
      RX: [PB12, PB5]

  TIM1:
    type: pwm
    signals:
      CH1: [PE9, PA8]
      CH2: [PE11, PA9]
      CH3: [PE13, PA10]
      CH4: [PE14, PA11]
  TIM2:
    type: pwm
    signals:
      CH1: [PA0, PA5, PA15]
      CH2: [PA1, PB3]
      CH3: [PA2, PB10]
      CH4: [PA3, PB11]
  TIM3:
    type: pwm
    signals:
      CH1: [PA6, PC6, PB4]
      CH2: [PA7, PC7, PB5]
      CH3: [PB0, PC8]
      CH4: [PB1, PC9]
  TIM4:
    type: pwm
    signals:
      CH1: [PD12, PB6]
      CH2: [PD13, PB7]
      CH3: [PD14, PB8]
      CH4: [PD15, PB9]
  TIM5:
    type: pwm
    signals:
      CH1: [PA0]
      CH2: [PA1]
      CH3: [PA2]
      CH4: [PA3]
  TIM8:
    type: pwm
    signals:
      CH1: [PC6]
      CH2: [PC7]
      CH3: [PC8]
      CH4: [PC9]
  TIM9:
    type: pwm
    signals:
      CH1: [PE5, PA2]
      CH2: [PE6, PA3]
  TIM10:
    type: pwm
    signals:
      CH1: [PB8]
  TIM11:
    type: pwm
    signals:
      CH1: [PB9]
  TIM12:
    type: pwm
    signals:
      CH1: [PB14]
      CH2: [PB15]
  TIM13:
    type: pwm
    signals:
      CH1: [PA6]
  TIM14:
    type: pwm
    signals:
      CH1: [PA7]

  USB_OTG_FS:
    type: usb
    signals:
      DM: [PA11]
      DP: [PA12]
      ID: [PA10]
      VBUS: [PA9]
  USB_OTG_HS:
    type: usb
    signals:
      DM: [PB14]
      DP: [PB15]
      ID: [PB12]
      VBUS: [PB13]

  ETH:
    type: ethernet
    signals:
      REF_CLK: [PA1]
      MDIO: [PA2]
      MDC: [PC1]
      CRS_DV: [PA7]
      RXD0: [PC4]
      RXD1: [PC5]
      TX_EN: [PB11]
      TXD0: [PB12]
      TXD1: [PB13]
