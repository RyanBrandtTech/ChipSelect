schema_version: 1
part_number: ATMEGA328P-AU
manufacturer: Microchip
description: 8-bit AVR MCU, 20 MHz, 32 KB flash, 2 KB RAM, TQFP-32
datasheet: https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-7810-Automotive-Microcontrollers-ATmega328P_Datasheet.pdf

# Placeholder price and stock, not live distributor data.
unit_cost_usd: 2.10
quantity_available: 40000

core: AVR
max_clock_mhz: 20
flash_kb: 32
ram_kb: 2
temperature: {min_c: -40, max_c: 85}

package:
  name: TQFP-32
  pin_count: 32
  length_mm: 9.0
  width_mm: 9.0
  height_mm: 1.2

power:
  supplies:
    - {name: VCC, min_v: 1.8, max_v: 5.5, required: true, description: 2.7 V minimum above 4 MHz and 4.5 V above 10 MHz}
    - {name: AVCC, min_v: 1.8, max_v: 5.5, required: true, description: Analog supply; within 0.3 V of VCC}
  io_voltages: [1.8, 3.3, 5.0]

counts:
  analog_inputs: 8
  analog_outputs: 0
  gpio: 23
  spi: 1
  i2c: 1
  pwm_pins: 6
  uart: 1
  can: 0
  usb: 0
  ethernet: 0
  ext_flash: 0

pins:
  gpio:
    [PB0, PB1, PB2, PB3, PB4, PB5, PB6, PB7,
     PC0, PC1, PC2, PC3, PC4, PC5, PC6,
     PD0, PD1, PD2, PD3, PD4, PD5, PD6, PD7]
  dedicated: [ADC6, ADC7]
  special:
    PB6: crystal (XTAL1)
    PB7: crystal (XTAL2)
    PC6: RESET

peripherals:
  ADC:
    type: adc
    signals:
      IN0: [PC0]
      IN1: [PC1]
      IN2: [PC2]
      IN3: [PC3]
      IN4: [PC4]
      IN5: [PC5]
      IN6: [ADC6]
      IN7: [ADC7]

  SPI:
    type: spi
    signals:
      NSS: [PB2]
      MOSI: [PB3]
      MISO: [PB4]
      SCK: [PB5]

  TWI:
    type: i2c
    signals:
      SDA: [PC4]
      SCL: [PC5]

  USART0:
    type: uart
    signals:
      RX: [PD0]
      TX: [PD1]
      CK: [PD4]

  TC0:
    type: pwm
    signals:
      OC0A: [PD6]
      OC0B: [PD5]
  TC1:
    type: pwm
    signals:
      OC1A: [PB1]
      OC1B: [PB2]
  TC2:
    type: pwm
    signals:
      OC2A: [PB3]
      OC2B: [PD3]
