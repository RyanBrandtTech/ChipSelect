schema_version: 1
part_number: STM32F411CEU6
manufacturer: STMicroelectronics
description: Arm Cortex-M4F MCU, 100 MHz, 512 KB flash, 128 KB RAM, USB OTG FS, UFQFPN-48
datasheet: https://www.st.com/resource/en/datasheet/stm32f411ce.pdf

# Price and stock as of 2026-10-11; not live data.
unit_cost_usd: 5.63
quantity_available: 500

core: Cortex-M4
max_clock_mhz: 100
flash_kb: 512
ram_kb: 128
temperature: {min_c: -40, max_c: 85}

package:
  name: UFQFPN-48
  pin_count: 48
  length_mm: 7.0
  width_mm: 7.0
  height_mm: 0.6

power:
  supplies:
    - {name: VDD, min_v: 1.8, max_v: 3.6, required: true, description: 1.7 V minimum needs the PDR_ON pin which this package lacks}
    - {name: VDDA, min_v: 1.8, max_v: 3.6, required: true, description: Analog supply; same potential as VDD}
    - {name: VBAT, min_v: 1.65, max_v: 3.6, required: false, description: RTC and backup domain; tie to VDD if unused}
  io_voltages: [1.8, 2.5, 3.3]

counts:
  analog_inputs: 10
  analog_outputs: 0
  gpio: 36
  spi: 5
  i2c: 3
  pwm_pins: 22
  uart: 3
  can: 0
  usb: 1
  ethernet: 0
  ext_flash: 0

pins:
  gpio:
    [PC13, PC14, PC15, PH0, PH1, PA0, PA1, PA2, PA3, PA4, PA5, PA6,
     PA7, PB0, PB1, PB2, PB10, PB12, PB13, PB14, PB15, PA8, PA9, PA10,
     PA11, PA12, PA13, PA14, PA15, PB3, PB4, PB5, PB6, PB7, PB8, PB9]
  special:
    PA13: SWDIO debug
    PA14: SWCLK debug
    PB2: BOOT1 strap
    PC14: 32.768 kHz crystal (OSC32_IN)
    PC15: 32.768 kHz crystal (OSC32_OUT)
    PH0: main crystal (OSC_IN)
    PH1: main crystal (OSC_OUT)

# STM32F4 pins select alternate functions independently, so signals are listed per pin.
peripherals:
  ADC:
    type: adc
    signals:
      IN0: [PA0]
      IN1: [PA1]
      IN2: [PA2]
      IN3: [PA3]
      IN4: [PA4]
      IN5: [PA5]
      IN6: [PA6]
      IN7: [PA7]
      IN8: [PB0]
      IN9: [PB1]

  SPI1:
    type: spi
    signals:
      SCK: [PA5, PB3]
      MISO: [PA6, PB4]
      MOSI: [PA7, PB5]
      NSS: [PA4, PA15]
  SPI2:
    type: spi
    signals:
      SCK: [PB10, PB13]
      MISO: [PB14]
      MOSI: [PB15]
      NSS: [PB12, PB9]
  SPI3:
    type: spi
    signals:
      SCK: [PB12, PB3]
      MISO: [PB4]
      MOSI: [PB5]
      NSS: [PA4, PA15]
  SPI4:
    type: spi
    signals:
      SCK: [PB13]
      MISO: [PA11]
      MOSI: [PA1]
      NSS: [PB12]
  SPI5:
    type: spi
    signals:
      SCK: [PB0]
      MISO: [PA12]
      MOSI: [PA10, PB8]
      NSS: [PB1]

  I2C1:
    type: i2c
    signals:
      SCL: [PB6, PB8]
      SDA: [PB7, PB9]
  I2C2:
    type: i2c
    signals:
      SCL: [PB10]
      SDA: [PB3, PB9]
  I2C3:
    type: i2c
    signals:
      SCL: [PA8]
      SDA: [PB4, PB8]

  USART1:
    type: uart
    signals:
      TX: [PA9, PA15, PB6]
      RX: [PA10, PB3, PB7]
      RTS: [PA12]
      CTS: [PA11]
      CK: [PA8]
  USART2:
    type: uart
    signals:
      TX: [PA2]
      RX: [PA3]
      RTS: [PA1]
      CTS: [PA0]
      CK: [PA4]
  USART6:
    type: uart
    signals:
      TX: [PA11]
      RX: [PA12]

  TIM1:
    type: pwm
    signals:
      CH1: [PA8]
      CH2: [PA9]
      CH3: [PA10]
      CH4: [PA11]
  TIM2:
    type: pwm
    signals:
      CH1: [PA0, PA5, PA15]
      CH2: [PA1, PB3]
      CH3: [PA2, PB10]
      CH4: [PA3]
  TIM3:
    type: pwm
    signals:
      CH1: [PA6, PB4]
      CH2: [PA7, PB5]
      CH3: [PB0]
      CH4: [PB1]
  TIM4:
    type: pwm
    signals:
      CH1: [PB6]
      CH2: [PB7]
      CH3: [PB8]
      CH4: [PB9]
  TIM5:
    type: pwm
    signals:
      CH1: [PA0]
      CH2: [PA1]
      CH3: [PA2]
      CH4: [PA3]
  TIM9:
    type: pwm
    signals:
      CH1: [PA2]
      CH2: [PA3]
  TIM10:
    type: pwm
    signals:
      CH1: [PB8]
  TIM11:
    type: pwm
    signals:
      CH1: [PB9]

  USB_OTG_FS:
    type: usb
    signals:
      DM: [PA11]
      DP: [PA12]
      ID: [PA10]
      VBUS: [PA9]
