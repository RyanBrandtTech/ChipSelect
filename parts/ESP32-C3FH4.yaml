schema_version: 1
part_number: ESP32-C3FH4
manufacturer: Espressif Systems
description: RISC-V Wi-Fi/Bluetooth LE SoC, 160 MHz, 400 KB SRAM, 4 MB in-package flash, QFN-32 5x5
datasheet: https://www.espressif.com/sites/default/files/documentation/esp32-c3_datasheet_en.pdf

# Placeholder price and stock, not live distributor data.
unit_cost_usd: 1.86
quantity_available: 1227

core: RISC-V RV32IMC
max_clock_mhz: 160
flash_kb: 4096
ram_kb: 400
temperature: {min_c: -40, max_c: 105}

package:
  name: QFN-32
  pin_count: 32
  length_mm: 5.0
  width_mm: 5.0
  height_mm: 0.9

power:
  supplies:
    - {name: VDDA, min_v: 3.0, max_v: 3.6, required: true, description: Analog supply}
    - {name: VDD3P3, min_v: 3.0, max_v: 3.6, required: true, description: Analog/RF supply}
    - {name: VDD3P3_RTC, min_v: 3.0, max_v: 3.6, required: true, description: RTC domain and RTC IO (GPIO0-GPIO5)}
    - {name: VDD3P3_CPU, min_v: 3.0, max_v: 3.6, required: true, description: Digital domain and digital IO; also feeds VDD_SPI for the in-package flash}
  io_voltages: [3.3]

counts:
  analog_inputs: 6
  analog_outputs: 0
  gpio: 15
  spi: 1
  i2c: 1
  pwm_pins: 15
  uart: 2
  can: 1
  usb: 1
  ethernet: 0
  ext_flash: 0

# GPIO11 (VDD_SPI, powers the in-package flash) and GPIO12-GPIO17 (SPI0/1 bus of
# the in-package flash) are not listed: the datasheet says not to use them.
pins:
  gpio:
    [GPIO0, GPIO1, GPIO2, GPIO3, GPIO4, GPIO5, GPIO6, GPIO7, GPIO8, GPIO9, GPIO10,
     GPIO18, GPIO19, GPIO20, GPIO21]
  special:
    GPIO0: 32.768 kHz crystal (XTAL_32K_P)
    GPIO1: 32.768 kHz crystal (XTAL_32K_N)
    GPIO2: strapping pin (boot mode)
    GPIO8: strapping pin (boot mode / ROM messages)
    GPIO9: strapping pin (boot mode, low selects download boot)

# Digital peripheral signals reach any GPIO through the GPIO matrix; ADC channels
# and the USB Serial/JTAG pins are fixed.
peripherals:
  ADC1:
    type: adc
    signals:
      CH0: [GPIO0]
      CH1: [GPIO1]
      CH2: [GPIO2]
      CH3: [GPIO3]
      CH4: [GPIO4]
  ADC2:
    type: adc
    signals:
      CH0: [GPIO5]

  SPI2:
    type: spi
    signals:
      SCK: &any [GPIO0, GPIO1, GPIO2, GPIO3, GPIO4, GPIO5, GPIO6, GPIO7, GPIO8, GPIO9, GPIO10,
             GPIO18, GPIO19, GPIO20, GPIO21]
      MISO: *any
      MOSI: *any
      NSS: *any

  I2C0:
    type: i2c
    signals: {SCL: *any, SDA: *any}

  UART0:
    type: uart
    signals: {TX: *any, RX: *any, RTS: *any, CTS: *any}
  UART1:
    type: uart
    signals: {TX: *any, RX: *any, RTS: *any, CTS: *any}

  TWAI:
    type: can
    signals: {TX: *any, RX: *any}

  LEDC:
    type: pwm
    signals: {CH0: *any, CH1: *any, CH2: *any, CH3: *any, CH4: *any, CH5: *any}

  USB:
    type: usb
    signals:
      DM: [GPIO18]
      DP: [GPIO19]
