  # TCC0 WO[4..7] and TCC1 WO[2..3] repeat the lower compare channels and are
  # not listed. TCC1 and TCC2 have two compare channels each.
  TCC0:
    type: pwm
    signals:
      WO0: [PA04, PA08]
      WO1: [PA05, PA09]
      WO2: [PA10, PA18]
      WO3: [PA11, PA19]
  TCC1:
    type: pwm
    signals:
      WO0: [PA06, PA10, PA30]
      WO1: [PA07, PA11, PA31]
  TCC2:
    type: pwm
    signals:
      WO0: [PA00, PA12, PA16]
      WO1: [PA01, PA13, PA17]
  TC3:
    type: pwm
    signals:
      WO0: [PA14, PA18]
      WO1: [PA15, PA19]
  TC4:
    type: pwm
    signals:
      WO0: [PA22, PB08]
      WO1: [PA23, PB09]
  TC5:
    type: pwm
    signals:
      WO0: [PA24, PB10]
      WO1: [PA25, PB11]

  USB:
    type: usb
    signals:
      DM: [PA24]
      DP: [PA25]
