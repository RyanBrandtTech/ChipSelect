schema_version: 1
title: Battery-powered sensor node

limits:
  max_unit_cost_usd: 4.00
  min_quantity_available: 1000
  max_area_mm2: 100
  max_height_mm: 2.0
  min_flash_kb: 32
  min_ram_kb: 8
  operating_temperature: {min_c: -20, max_c: 70}

power:
  supply_rails_v: [3.3]
  io_voltage_v: 3.3

interfaces:
  - name: imu
    type: spi
    signals: [SCK, MISO, MOSI]
    description: IMU and barometer share the bus; chip selects are GPIO
  - name: env_sensor
    type: i2c
    signals: [SCL, SDA]
  - name: debug_console
    type: uart
    signals: [TX, RX]
  - name: host_link
    type: usb
    signals: [DM, DP]
  - name: battery_and_thermistors
    type: adc
    channels: 3
  - name: status_led_dimming
    type: pwm
    channels: 2

gpio: 6
